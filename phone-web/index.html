<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ClawBridge</title>
<style>
  body{font-family:system-ui;margin:0;background:#111;color:#eee;display:flex;flex-direction:column;height:100vh}
  #log{flex:1;overflow-y:auto;padding:12px}
  .msg{margin:6px 0;padding:8px 12px;border-radius:10px;max-width:85%;white-space:pre-wrap}
  .me{background:#2563eb;margin-left:auto}
  .ai{background:#26262e}
  #bar{display:flex;gap:8px;padding:10px;background:#1a1a1f}
  input{flex:1;padding:10px;border-radius:8px;border:0;background:#26262e;color:#eee}
  button{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff}
  #skills{padding:8px;background:#1a1a1f;display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:4px 10px;border-radius:999px;background:#333;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div id="skills"></div>
<div id="log"></div>
<div id="bar">
  <button id="mic">🎤</button>
  <input id="t" placeholder="说话或输入，/skills 看技能">
  <button id="send">发送</button>
</div>
<script>
// 配置：部署后改成你的域名和 token
const API = location.origin + '/api';
const TOKEN = localStorage.cb_token || (localStorage.cb_token = prompt('client token:'));
const H = { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' };
const log = document.getElementById('log');

function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

async function ask(text) {
  add('me', text);
  const r = await fetch(API + '/ask', { method: 'POST', headers: H, body: JSON.stringify({ text }) });
  const j = await r.json();
  add('ai', j.text || j.error);
}

async function loadSkills() {
  const r = await fetch(API + '/skills', { headers: H });
  const j = await r.json();
  document.getElementById('skills').innerHTML =
    (j.skills || []).map(s => `<span class="chip" onclick="ask('/use ${s.name}')">${s.name}</span>`).join('');
}

document.getElementById('send').onclick = () => { const t = document.getElementById('t'); ask(t.value); t.value=''; };
document.getElementById('t').onkeydown = e => { if (e.key==='Enter') document.getElementById('send').click(); };

// 语音输入（Chrome/Safari 均支持 webkitSpeechRecognition）
document.getElementById('mic').onclick = () => {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) return alert('此浏览器不支持语音识别');
  const rec = new R(); rec.lang = 'zh-CN';
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.start();
};

loadSkills();
</script>
</body>
</html>
